name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "dev"
      - "main"
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'src/backend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v7.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: cache pytest
        uses: actions/cache@v5.0.4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('src/backend/**/*.py') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: cp .env.example .env
      - run: uv run pytest --lf --ff
      - uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
